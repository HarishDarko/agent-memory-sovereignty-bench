[project]
name = "agent-memory-sovereignty-bench"
version = "0.1.0"
description = "Agent Memory Sovereignty Bench (AMSB): provider-neutral evaluation of persistent agent memory covering controlled vs native behavior, lifecycle guarantees, recovery, and capability attribution."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
gateway = ["httpx>=0.27"]   # only needed when the real DeepSeek gateway mode is enabled
hindsight = ["httpx>=0.27"]  # Hindsight adapter talks to the pinned server over HTTP
mem0 = ["mem0ai==2.0.17", "chromadb==1.5.9", "fastembed==0.8.0"]  # pinned researched versions
dev = ["pytest>=8"]         # optional; tests run on stdlib unittest

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
