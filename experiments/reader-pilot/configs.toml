# Preregistered reader-setting variants compared in the cost-gated pilot.
# Everything else is fixed by the frozen protocol: model deepseek-v4-flash,
# stateless single request, JSON output, token budget 2048.

[settings.thinking_high]
name = "thinking-high-temp0"
